<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0D">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* The desktop's tokens, only the ones a phone needs. Kept literal rather
     than imported: this page must render before anything else loads, on a
     connection that may be a train. */
  :root {
    --bg-base: #0C0C0D;
    --bg-surface: #141415;
    --bg-raised: #1A1A1C;
    --border: rgba(255,255,255,0.098);
    --border-subtle: rgba(255,255,255,0.058);
    --text: #EDEDEF;
    --text-2: #9E9EA6;
    --text-3: #6B6B74;
    --accent: #D9A55C;
    --accent-muted: rgba(217,165,92,0.14);
    --danger: #E28B7C;
    --waiting: #7FA6CC;
    --ok: #6FBF8E;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-base: #F7F7F5; --bg-surface: #FFFFFF; --bg-raised: #F0F0ED;
      --border: rgba(0,0,0,0.10); --border-subtle: rgba(0,0,0,0.06);
      --text: #26261F; --text-2: #5C5C55; --text-3: #8E8E86;
      --accent: #9A6A1E; --accent-muted: rgba(154,106,30,0.10);
      --danger: #B23F2C; --waiting: #2F5F8F; --ok: #2C7A4B;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-base); color: var(--text); font-family: var(--font);
    font-size: 15px; line-height: 1.5;
    /* Safe areas: this runs full-screen when installed, and a button under
       the home indicator is a button nobody can press. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .device { font-size: 12px; color: var(--text-3); }

  /* Freshness is the first thing on the page, not a footnote (§28). */
  .fresh { font-size: 12px; color: var(--text-3); margin-bottom: 20px; }
  .fresh[data-stale] { color: var(--danger); }

  section { margin-bottom: 26px; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
       text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }

  .card {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: 10px; padding: 14px; margin-bottom: 8px;
  }
  .card__title { font-size: 15px; margin-bottom: 4px; }
  .card__meta { font-size: 13px; color: var(--text-2); }
  .card__project { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }

  .status { display: inline-block; font-size: 11px; padding: 2px 7px;
            border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
  .status[data-s="running"], .status[data-s="verifying"] { background: var(--accent-muted); color: var(--accent); }
  .status[data-s="waiting"], .status[data-s="blocked"] { background: rgba(127,166,204,0.14); color: var(--waiting); }
  .status[data-s="failed"] { background: rgba(226,139,124,0.14); color: var(--danger); }

  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
         color: var(--text-2); word-break: break-all; }

  /* Buttons are 44px tall because that is what a thumb needs. */
  button {
    font: inherit; font-size: 15px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-raised); color: var(--text);
    min-height: 44px; padding: 0 18px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #17130C; font-weight: 500; }
  button:disabled { opacity: 0.5; }
  button.wide { width: 100%; }

  input {
    font: inherit; font-size: 17px; /* 17px or iOS zooms the page on focus. */
    width: 100%; min-height: 48px; padding: 0 14px;
    background: var(--bg-surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    text-transform: uppercase; letter-spacing: 0.12em; text-align: center;
    font-family: ui-monospace, monospace;
  }

  .empty { color: var(--text-3); font-size: 14px; padding: 18px 0; }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; }
  .hint { font-size: 13px; color: var(--text-3); margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
