[package]
name = "jarvis"
version = "0.5.0"
description = "J.A.R.V.I.S. — a universal operating environment for AI-agent software development."
authors = ["Alan Araujo"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
parking_lot = "0.12"
portable-pty = "0.9"
cpal = "0.15"
hound = "3"
sha2 = "0.10"
ureq = "2"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
url = "2.5.8"

[target."cfg(windows)".dependencies]
# Job objects: children of a PTY (node, git, nested shells) do not die with the
# pty handle. A job with KILL_ON_JOB_CLOSE guarantees no orphaned processes even
# if J.A.R.V.I.S. itself is killed.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
